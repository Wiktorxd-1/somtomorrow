<!DOCTYPE html>
<html lang="nl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}{% endblock %} - Somtomorrow</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/main/base.css') }}">
        <script src="https://kit.fontawesome.com/4a94c21782.js" crossorigin="anonymous"></script>
        {% block extra_headers %}{% endblock %}
    </head>
    <body>
        <header id="sidebar">
            <div id="menu">
                <img src="/static/images/logo_padding.png" id="logo">
                <a href="/dashboard" class="menu-item{% if active_page == 'dashboard' %} active{% endif %} primary">
                    <i class="fa-solid fa-house-user"></i> <span>Dashboard</span>
                </a>
                <a href="/rooster" class="menu-item{% if active_page == 'schedule' %} active{% endif %} primary">
                    <i class="fa-solid fa-calendar-days"></i> <span>Rooster</span>
                </a>
                <a href="/planner" class="menu-item{% if active_page == 'planner' %} active{% endif %} primary">
                    <i class="fa-solid fa-clipboard-list"></i> <span>Planner</span>
                </a>
                <a href="/cijfers/toetscijfers" class="menu-item{% if active_page == 'grades' %} active{% endif %} primary">
                    <i class="fa-solid fa-square-poll-vertical"></i> <span>Cijfers</span>
                </a>
                <a href="/materialen" class="menu-item{% if active_page == 'materials' %} active{% endif %} primary">
                    <i class="fa-solid fa-book"></i> <span>Materialen</span>
                </a>
                <a href="/afwezigheid" class="menu-item{% if active_page == 'absence' %} active{% endif %} secondary">
                    <i class="fa-solid fa-clock"></i> <span>Afwezigheid</span>
                </a>
                <a href="/vakken" class="menu-item{% if active_page == 'classes' %} active{% endif %} secondary">
                    <i class="fa-solid fa-book-open"></i> <span>Vakken</span>
                </a>
                <!--
                <a href="/schoolinformatie" class="menu-item{% if active_page == 'schoolinfo' %} active{% endif %} secondary">
                    <i class="fa-solid fa-school"></i> <span>Schoolinformatie</span>
                </a>
                <a href="/instellingen" class="menu-item{% if active_page == 'settings' %} active{% endif %} secondary">
                    <i class="fa-solid fa-gears"></i> <span>Instellingen</span>
                </a>
                -->
            </div>
            <div id="logout">
                <a href="/logout" class="menu-item">
                    <i class="fa-solid fa-right-from-bracket"></i> <span>Uitloggen</span>
                </a>
            </div>
        </header>

        <main>
            <div id="topbar">
                <div id="profilecontainer">
                    <img id="avatar" src="/identicon/{{ g.identicon_name }}">
                    <div id="userinfocontainer">
                        <span id="userinfoname">{{ g.first_name }} {{ g.last_name }}</span>
                        <span id="userinfoschoolclass">{{ g.school_name }} • {{ g.main_class }}</span>
                    </div>
                </div>
            </div>
            <div id="content">
                {% block content %}{% endblock %}
            </div>
        </main>

        <script>
            function islandParser(island, island_url) {
                if (!island_url) return;

                island.innerHTML = '<div id="island-loading"><span>Data ophalen...</span><img src="/loading.gif"></div>';

                fetch(`/api/islands/${island_url}`)
                    .then(response => {
                        if (response.status === 401) {
                            window.location.href = "/logout";
                            return Promise.reject(new Error("Unauthorized"));
                        }
                        if (!response.ok) {
                            if (response.status === 404 ) {
                                throw new Error("That is not a island you idiot! HTTP 404 of course");
                            } else { 
                                throw new Error(`HTTP error! Status: ${response.status}`);
                            }
                        }
                        return response.text();
                    })
                    
                    .then(data => {
                        if (data) {
                            island.innerHTML = data;
                            
                            // Find scripts, and make them actualy excecutable by just appending them to the body
                            island.querySelectorAll("script").forEach(oldScript => {
                                const newScript = document.createElement("script");
                                newScript.textContent = oldScript.textContent; // Inline scripts, so just JS inside the HTML
                                
                                if (oldScript.src) newScript.src = oldScript.src; // Scripts with a src

                                if (oldScript.async) newScript.async = oldScript.async; // Scripts with a async

                                document.body.appendChild(newScript);
                                oldScript.remove(); // Remove the old script to prevent duplication
                            });
                        }
                    })

                    .catch(error => {
                        console.error("Error fetching data:", error);
                        island.innerHTML = `Error fetching data! ${error}`;
                    });
            };

            document.querySelectorAll(".island").forEach(island => {
                let island_url = island.getAttribute("island-url");
                islandParser(island, island_url)
            });
        </script>
    </body>
</html>
