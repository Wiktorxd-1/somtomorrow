<div id="weekcontainer">
    {% for day in planner_data %}
        <div class="daycontainer">
            <div class="dayheader">{{ dayname[loop.index0] }}</div>
            {% for homework in day %}
                <div class="homeworkitem{{ ' finished' if homework.is_finished else ' not-finished' }} {{ homework.type }}">
                    <span class="subject-icon">{{ homework.icon | safe }}</span>
                    <span class="subject-name" data-subject-full="{{ homework.subject_long }}" data-subject-short="{{ homework.subject_short }}">{{ homework.subject_long }}</span>
                    <span class="homework-title">{{ homework.title }}</span>
                    <div class="homework-finished-container{{ ' true' if homework.is_finished else ' false' }}" id="{{ homework.id }}">
                        <i class="fa-solid fa-check"></i>
                    </div>

                </div>
            {% endfor %}
        </div>
    {% endfor %}
</div>

<script>
    const checkBoxes = document.querySelectorAll(".homework-finished-container");
    
    checkBoxes.forEach(checkBox => {
        checkBox.addEventListener("click", function () {  
            if (checkBox.classList.contains("true")) {
                checkBox.classList.remove("true");
                checkBox.classList.add("false");
            } else {
                checkBox.classList.remove("false");
                checkBox.classList.add("true");
            }
        });
    })
    
</script>
